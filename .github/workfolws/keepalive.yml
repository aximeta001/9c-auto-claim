name: 保活（防止定时任务被自动停用）

# GitHub 官方规则：仓库 60 天没有任何活动，会自动禁用 scheduled workflow。
# 本任务每周打一个「空提交」制造一次仓库活动，让领奖任务持续可用。
# 领奖任务只监听 schedule / workflow_dispatch，不会被这个提交触发。
on:
  schedule:
    - cron: '23 4 * * 1'   # 每周一 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write           # 空提交需要写权限，见 DEPLOY.md 第 4 步

concurrency:
  group: 9c-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: 空提交保活
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows alive"
          git push origin HEAD:"${GITHUB_REF_NAME}"
